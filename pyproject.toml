[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
  "app/static/*",
  "app/templates/*",
  "app/inspect_*",
  "app/*snippet*",
]
fail_under = 80
skip_covered = true

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "(migrations|node_modules|dist|build)"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = "(^migrations/|^app/static/|^app/templates/)"

# db.Model is a Flask-SQLAlchemy runtime attribute mypy cannot statically
# resolve as a base class; every ORM model module hits this the same way.
[[tool.mypy.overrides]]
module = [
    "app.models.*",
    "app.modules.strategic_performance.models",
    "app.services.performance.models_phase5_template",
]
disable_error_code = ["name-defined"]

# Dynamic property monkeypatching on an ORM class after definition
# (wrapped in try/except NameError) confuses mypy's method/assignment
# checks; contained to this one file.
[[tool.mypy.overrides]]
module = "app.models.performance_low_score_models"
disable_error_code = ["method-assign", "assignment"]

# db.relationship(..., lazy="dynamic") returns an AppenderQuery at runtime
# but mypy sees the plain RelationshipProperty descriptor (no stubs model
# the lazy="dynamic" instance-access behavior), so .filter()/.order_by()/
# .first()/.all() on these attributes misreport as "not callable". Verified
# every remaining finding in this file is this exact pattern before adding.
[[tool.mypy.overrides]]
module = "app.services.communication_phase2_service"
disable_error_code = ["misc", "operator"]

# These modules receive their names via `globals().update(route_globals)`
# from the parent route module at registration time (see app/api/mobile/*
# read-route bridges) - a pattern already accepted for ruff's F821 in
# app/menu_registry.py and friends.
[[tool.mypy.overrides]]
module = [
    "app.api.mobile.performance_read_routes",
    "app.api.mobile.light_read_routes",
    "app.api.mobile.communication_read_routes",
    "app.api.mobile.detail_read_routes",
    "app.api.mobile.support_survey_read_routes",
    "app.api.mobile.communication_v2_read_routes",
    "app.api.mobile.utility_routes",
]
disable_error_code = ["name-defined"]

# Dynamic menu/live-scope globals populated via globals().get(...)/globals()
# injection elsewhere in the module - the same pattern already annotated
# with `# noqa: F821 - dynamic menu registry global` for ruff. The same
# module-level names get reassigned via globals().get(...) at many
# independent points across these files (one per historical "Faz" split),
# which defeats mypy's redefinition tracking for the accumulator variables
# built from them (assignment/attr-defined/index/call-overload), not just
# the name lookup itself.
[[tool.mypy.overrides]]
module = [
    "app.live_scope",
    "app.menu_registry",
    "app.menu_registry_data_sections",
    "app.menu_registry_data_performance",
]
disable_error_code = ["name-defined", "assignment", "attr-defined", "index", "call-overload"]

# Same reused-throwaway-variable-name-across-independent-blocks pattern as
# menu_registry.py (each historical "V-something" role matrix patch block
# reuses `_rows`/`_group` at module scope with a different inferred
# list/tuple shape). Every remaining finding here was individually verified
# to be this pattern before disabling.
[[tool.mypy.overrides]]
module = "app.services.role_matrix_ui_service"
disable_error_code = ["assignment", "operator", "arg-type", "attr-defined"]

# Every remaining finding in this file is joinedload(Model.relationship)
# against the same unstubbed lazy="dynamic" relationship descriptor as
# elsewhere; verified individually (no other arg-type finding exists here).
[[tool.mypy.overrides]]
module = "app.services.leave_delegation_service"
disable_error_code = ["arg-type"]
