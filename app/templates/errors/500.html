<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title|default('Beklenmeyen Hata') }} - BYS360</title>
  <style>
    :root{--bys-red:#8B0000}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      padding-top:calc(24px + env(safe-area-inset-top,0px));
      padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
      padding-left:calc(24px + env(safe-area-inset-left,0px));
      padding-right:calc(24px + env(safe-area-inset-right,0px));
      font-family:"Inter","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      background:linear-gradient(180deg,#f7f8fb 0%,#f1f4f8 100%);
      color:#111827;
    }
    .error-shell{max-width:480px;width:100%;text-align:center;background:#fff;border:1px solid rgba(15,23,42,.08);border-radius:24px;padding:36px 28px;box-shadow:0 18px 44px rgba(15,23,42,.08)}
    .error-code{margin:0 0 10px;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bys-red)}
    h1{margin:0 0 12px;font-size:1.4rem;font-weight:900;line-height:1.3}
    p{margin:0 0 24px;color:#4b5563;line-height:1.7;font-size:.98rem}
    .error-home-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:14px;background:var(--bys-red);color:#fff;text-decoration:none;font-weight:800;font-size:.95rem}
    .error-home-link:focus-visible{outline:2px solid var(--bys-red);outline-offset:3px}
    @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
  </style>
</head>
<body>
  <main class="error-shell">
    <p class="error-code">BYS360 · 500</p>
    <h1>{{ title|default('Beklenmeyen Hata') }}</h1>
    <p>{{ message|default('İşlem sırasında geçici bir hata oluştu. Lütfen daha sonra tekrar deneyiniz.') }}</p>
    <a class="error-home-link" href="{{ url_for('main.index') }}">Ana Sayfaya Dön</a>
  </main>
</body>
</html>
