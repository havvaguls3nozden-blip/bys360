<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8B0000">
  <title>BYS360 - Bağlantı Yok</title>
  <style>
    :root{--bys-red:#8B0000;--bys-text:#111827;--bys-muted:#667085;--bys-bg:#f7f8fb;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:radial-gradient(circle at top right,rgba(139,0,0,.12),transparent 30%),linear-gradient(180deg,#fff,#f3f4f8);color:var(--bys-text);display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom))}
    .card{width:min(520px,100%);background:rgba(255,255,255,.94);border:1px solid rgba(139,0,0,.12);border-radius:28px;box-shadow:0 24px 70px rgba(15,23,42,.14);overflow:hidden}.bar{height:8px;background:linear-gradient(90deg,#6d0000,#8B0000,#b01818)}.inner{padding:28px}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(139,0,0,.15);background:#fff7f7;color:var(--bys-red);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}h1{font-size:26px;line-height:1.15;margin:20px 0 10px;color:var(--bys-red)}p{font-size:16px;line-height:1.55;color:var(--bys-muted);margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{appearance:none;border:0;border-radius:16px;padding:13px 16px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--bys-red);color:#fff}.secondary{background:#f2f4f7;color:#344054}.small{font-size:13px;color:#98a2b3;margin-top:18px}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="bar"></div>
    <section class="inner">
      <span class="badge">BYS360 Mobil</span>
      <h1>Bağlantı kurulamadı</h1>
      <p>İnternet veya kurum ağı bağlantınızı kontrol ederek tekrar deneyiniz. Güvenlik nedeniyle personel, performans, mesaj ve oturum bilgileri çevrimdışı saklanmaz.</p>
      <div class="actions">
        <a class="btn primary" href="/">Tekrar dene</a>
        <button class="btn secondary" onclick="location.reload()">Sayfayı yenile</button>
      </div>
      <div class="small">© 2026 Çanakkale Savaşları Gelibolu Tarihi Alan Başkanlığı</div>
    </section>
  </main>
</body>
</html>
