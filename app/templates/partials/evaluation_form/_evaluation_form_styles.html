        opacity:0;
        pointer-events:none;

        border-color:#8B0000;
        color:#fff;

    }

        transition:.18s ease;

        transform:translateY(-1px);

        background:linear-gradient(180deg,#8B0000,#6f0000);

        .workspace-grid{

            grid-template-columns:repeat(2,minmax(0,1fr));
        }
    }

        .matrix-head,
        .criteria-row{
            grid-template-columns:230px 1fr;
        }

        .criteria-cell.side,
        .matrix-head .head-side{
            grid-column:1 / -1;
            border-top:1px solid rgba(15,23,42,.08);
        }
    }

    @media (max-width:1200px){
        .top-total-band,
        .workspace-totals{
            grid-template-columns:repeat(2,minmax(0,1fr));
        }

        .info-grid,
        .workspace-meta-grid,
        .workspace-rule-grid{
            grid-template-columns:repeat(2,minmax(0,1fr));
        }
    }

    @media (max-width:760px){

        .workspace-totals,
        .info-grid,
        .workspace-grid,
        .workspace-meta-grid,
        .workspace-rule-grid{
            grid-template-columns:1fr;
        }

        .matrix-head,
        .criteria-row{
            grid-template-columns:1fr;
        }

            border-right:none;
            border-bottom:1px solid rgba(15,23,42,.08);

        .matrix-head div{

            border-bottom:1px solid rgba(15,23,42,.08);
        }

        .matrix-head div:last-child{
            border-bottom:none;

        .score-help{
            grid-template-columns:repeat(5,minmax(48px,1fr));

        box-shadow:0 20px 40px rgba(139,0,0,.10), 0 8px 20px rgba(15,23,42,.05);

        gap:10px;
        margin-top:12px;
    }

    .focus-comment-badge{
        display:inline-flex;
        align-items:center;
        min-height:34px;
        padding:0 12px;
        border-radius:999px;
        background:rgba(139,0,0,.10);
        color:#8B0000;
        font-size:.78rem;
        font-weight:900;
        border:1px solid rgba(139,0,0,.14);
