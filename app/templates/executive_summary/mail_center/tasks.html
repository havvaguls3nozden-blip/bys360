{% extends "executive_summary/mail_center/base.html" %}{% set active='tasks' %}{% block mail_center_body %}<form method="post"><div class="mailx-grid">{% for t in tasks %}<div class="mailx-card mailx-col-6"><h3>{{ t.title }}</h3><p class="mailx-muted">{{ t.description }}</p><label><input type="checkbox" name="{{t.key}}_enabled" value="1" {% if t.enabled %}checked{% endif %}> Aktif</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div><label>Saat</label><input class="mailx-input" name="{{t.key}}_hour" value="{{t.hour}}"></div><div><label>Dakika</label><input class="mailx-input" name="{{t.key}}_minute" value="{{t.minute}}"></div></div></div>{% endfor %}<div class="mailx-col-12"><button class="mailx-btn">Görevleri Kaydet</button></div></div></form>{% endblock %}
