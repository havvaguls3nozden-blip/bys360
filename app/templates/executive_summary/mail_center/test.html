{% extends "executive_summary/mail_center/base.html" %}{% set active='test' %}{% block mail_center_body %}<div class="mailx-grid"><div class="mailx-card mailx-col-6"><h3>Test gönderimi</h3><form method="post"><label>Görev</label><select class="mailx-input" name="task_key">{% for t in tasks %}<option value="{{t.key}}">{{t.title}}</option>{% endfor %}</select><label style="display:block;margin-top:10px"><input type="checkbox" name="dry_run" value="1" checked> Kuru çalışma</label><label style="display:block;margin-top:10px"><input type="checkbox" name="only_me" value="1"> Sadece bana gönder</label><button class="mailx-btn" style="margin-top:12px">Testi Çalıştır</button></form></div><div class="mailx-card mailx-col-6"><h3>Sonuç</h3>{% if result %}<pre style="white-space:pre-wrap">{{ result }}</pre>{% else %}<p class="mailx-muted">Henüz test çalıştırılmadı.</p>{% endif %}</div></div>{% endblock %}
