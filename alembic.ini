# BYS360 Alembic configuration
# Bu dosya devir teslim ve temiz makine kurulumunda Alembic CLI aracının
# proje migration klasörünü bulabilmesi için eklenmiştir.
# Gerçek veritabanı bağlantısı bu dosyaya yazılmaz; .env / ortam değişkenleri
# ve Flask uygulama yapılandırması üzerinden yönetilir.

[alembic]
script_location = migrations
prepend_sys_path = .

# Güvenlik notu:
# Gerçek kullanıcı, parola, sunucu veya veritabanı adı burada tutulmaz.
# Flask-Migrate/app config kullanan akışlarda bağlantı config.py ve ortam
# değişkenlerinden okunur. Alembic CLI ile manuel çalışma gerekiyorsa
# DATABASE_URL ortam değişkeni kurum yetkilisi tarafından lokal ortamda verilir.
sqlalchemy.url = sqlite:///:memory:

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
