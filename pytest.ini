[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
addopts = --strict-markers --disable-warnings
norecursedirs =
    .git
    .venv
    venv
    .venv_old_*
    venv_old_*
    node_modules
    __pycache__
    .pytest_cache
    .mypy_cache
    reports
    releases
    archive
    backups
markers =
    ci_safe: CI güvenli testler.
    legacy_integration: BYS360 test işaretleyicisi.
    live: Canlı servis veya dış bağımlılık gerektiren testler.
    mobile: BYS360 test işaretleyicisi.
    realdb: Gerçek veritabanı gerektiren testler.
    slow: Uzun süren testler.
    source_smoke: BYS360 test işaretleyicisi.
    uat: BYS360 test işaretleyicisi.
